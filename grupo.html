<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#214995">
<meta name="description" content="Grupo del Majané Kaitz 2026 de Or Jadash Juventud">
<title>Grupo · Tojnit Majané Kaitz 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Montserrat,Arial,sans-serif}
body{background:#f3f6fb}main{max-width:1180px;margin:0 auto;background:white}
.hero{position:relative;min-height:440px;height:440px;width:100%;background:var(--group-hero,#214995);display:flex;justify-content:center;align-items:flex-start;overflow:hidden}.group-photo{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;object-position:center center;display:block;filter:brightness(.88)}.hero.has-group-photo{background-color:#eef3fa}.hero h1{pointer-events:none}
.hero h1{position:relative;z-index:1;color:#fff;text-align:center;font-weight:900;font-size:clamp(38px,7vw,84px);line-height:1.1;margin:0;padding:clamp(20px,4vw,44px) 16px 14px;letter-spacing:-.025em;text-shadow:0 3px 15px rgba(0,0,0,.8);overflow-wrap:anywhere}

@media(max-width:600px){.hero h1{padding-top:24px}}

.topbar{display:flex;align-items:center;justify-content:space-between;gap:28px;padding:28px clamp(22px,5vw,70px);background:#fff;min-height:126px}
.brand{display:flex;align-items:center;gap:22px;text-decoration:none;color:#214995;min-width:0}
.brand img{display:block;width:90px;max-height:76px;object-fit:contain;flex-shrink:0}
.brand-title{font-size:clamp(19px,2.3vw,32px);line-height:1.18;font-weight:900;letter-spacing:-.02em}
.back-link{display:inline-flex;justify-content:center;align-items:center;padding:17px 29px;text-decoration:none;border:3px solid #dce6f9;border-radius:999px;font-size:clamp(14px,1.45vw,19px);font-weight:800;color:#193970;white-space:nowrap;background:#fff}
.back-link:hover,.back-link:focus-visible{border-color:#214995}
@media(max-width:760px){.topbar{min-height:0;padding:18px;gap:12px}.brand{gap:12px}.brand img{width:62px;max-height:62px}.brand-title{font-size:clamp(13px,3.4vw,20px)}.back-link{font-size:12px;padding:12px 14px;border-width:2px;white-space:normal;text-align:center}}

.innovation-section{padding:62px clamp(20px,6vw,76px) 85px;background:#f2f6ff}
.innovation-kicker{font-size:12px;font-weight:800;letter-spacing:.14em;text-transform:uppercase;color:#3c92b5}
.innovation-section h2{font-size:clamp(30px,4.5vw,48px);color:#214995;margin:13px 0 12px;font-weight:900;letter-spacing:-.035em}
.innovation-subtitle{color:#607291;line-height:1.6;font-size:16px}
.innovation-grid{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:17px;margin-top:30px}
.innovation-link{background:#fff;border:2px solid #dce7f9;border-radius:22px;padding:23px;min-height:128px;display:flex;align-items:center;justify-content:space-between;gap:10px;color:#214995;text-decoration:none;font-size:clamp(17px,2vw,23px);font-weight:800;box-shadow:0 8px 20px rgba(22,51,102,.06);transition:transform .2s,border-color .2s}
.innovation-link:hover,.innovation-link:focus-visible{transform:translateY(-4px);border-color:#8b3fff}
.innovation-link span{font-size:28px;color:#4385bc}
@media(max-width:850px){.innovation-grid{grid-template-columns:repeat(2,minmax(0,1fr))}}
@media(max-width:530px){.innovation-grid{grid-template-columns:1fr}.innovation-link{min-height:85px}}
</style>
</head>
<body>
<main>
<header class="topbar">
  <a class="brand" href="index.html">
    <img data-zip-path="assets/logo-or-jadash.png" alt="Or Jadash Juventud">
    <span class="brand-title">TOJNIT · MAJANÉ KAITZ 2026</span>
  </a>
  <a class="back-link" href="grupos.html">← Todos los grupos</a>
</header>
<section class="hero" aria-label="Foto del grupo">
<h1 id="group-name"></h1>
</section>
<section class="innovation-section" id="innova" aria-labelledby="innova-title">
 <div class="innovation-kicker">Planificación del grupo</div>
 <h2 id="innova-title">Innová en tu hoja de planificación</h2>
 <p class="innovation-subtitle">Elegí una categoría para sumar ideas y propuestas de tu grupo.</p>
 <div class="innovation-grid">
  <a class="innovation-link" data-topic="racional" href="racional.html">Racional <span aria-hidden="true">→</span></a>
  <a class="innovation-link" data-topic="tema" href="planificacion.html?seccion=tema">Tema <span aria-hidden="true">→</span></a>
  <a class="innovation-link" data-topic="hilo" href="planificacion.html?seccion=hilo">Hilo <span aria-hidden="true">→</span></a>
  <a class="innovation-link" data-topic="juegos" href="planificacion.html?seccion=juegos">Juegos <span aria-hidden="true">→</span></a>
  <a class="innovation-link" data-topic="dinamicas" href="planificacion.html?seccion=dinamicas">Dinámicas <span aria-hidden="true">→</span></a>
  <a class="innovation-link" data-topic="dinamicas-de-cierre" href="planificacion.html?seccion=dinamicas-de-cierre">Dinámicas de cierre <span aria-hidden="true">→</span></a>
  <a class="innovation-link" data-topic="momentos" href="planificacion.html?seccion=momentos">Momentos <span aria-hidden="true">→</span></a>
 </div>
</section>
</main>
<script>
const groups=['Jaza','Mega','Nifla','Leitza','Mabri','Kasu','Mebu','Shingsha','Jamu','Shoja','Metu','Shalu','Netza','Ofna','LojaMuza'];
const groupColors={"jaza":["#F49AC2","#61B779"],"mega":["#FF9C4A","#80D8F2"],"nifla":["#F69BC9","#FFE56A"],"leitza":["#4AAD65","#F05252"],"mabri":["#8BD9F0","#AD86DF"],"kasu":["#E64B53","#2859B4"],"mebu":["#6BC680","#94DDF4"],"shingsha":["#FFFFFF","#151515"],"jamu":["#AE83DD","#FF9C42"],"shoja":["#F7A44C","#62BE78"],"metu":["#3977C9","#8C69CD"],"shalu":["#8CDEF6","#F7A9CB"],"netza":["#205C45","#8252AC","#181818"],"ofna":["#3573C4","#5BC182"],"lojamuza":["#316BC3","#F39AC6","#181818"]};
const requested=new URLSearchParams(location.search).get('grupo')||'';
const group=groups.find(g=>g.toLowerCase()===requested.toLowerCase());
if(!group){location.replace('index.html#grupos')}
else{
  document.getElementById('group-name').textContent=group;
  document.documentElement.dataset.grupo=group.toLowerCase();
  document.title=group+' · Tojnit Majané Kaitz 2026';
  document.querySelectorAll('.innovation-link[data-topic]').forEach(link=>{link.href=link.dataset.topic==='racional'?'racional.html?grupo='+encodeURIComponent(group.toLowerCase()):'planificacion.html?grupo='+encodeURIComponent(group.toLowerCase())+'&seccion='+encodeURIComponent(link.dataset.topic);});
  const colors=groupColors[group.toLowerCase()];
  document.documentElement.style.setProperty('--group-hero','linear-gradient(115deg,'+colors.map((c,i)=>c+' '+Math.round(i*100/(colors.length-1))+'%').join(',')+')');
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script defer src="imagenes.js"></script>
<script defer src="fotos-grupos.js?v=18"></script>
</body>
</html>
