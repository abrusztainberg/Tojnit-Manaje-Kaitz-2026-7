<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="theme-color" content="#214995">
<meta name="description" content="Grupo del Majané Kaitz 2026 de Or Jadash Juventud">
<title>Grupo · Tojnit Majané Kaitz 2026</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700;800;900&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
html,body{margin:0;min-height:100%;font-family:Montserrat,Arial,sans-serif}
body{background:#f3f6fb}
.hero{position:relative;min-height:100vh;min-height:100svh;width:100%;background:var(--group-hero,#214995);background-position:center 40%;background-size:cover;background-repeat:no-repeat;display:flex;justify-content:center;align-items:flex-start;overflow:hidden}
.hero h1{position:relative;z-index:1;color:#fff;text-align:center;font-weight:900;font-size:clamp(38px,7vw,84px);line-height:1.1;margin:0;padding:clamp(20px,4vw,44px) 16px 14px;letter-spacing:-.025em;text-shadow:0 3px 15px rgba(0,0,0,.8);overflow-wrap:anywhere}
:root[data-grupo="leitza"] .hero.has-group-photo,
:root[data-grupo="mabri"] .hero.has-group-photo,
:root[data-grupo="netza"] .hero.has-group-photo{background-position:center 78%!important}
@media(max-width:600px){.hero h1{padding-top:24px}}
</style>
</head>
<body>
<main>
<section class="hero" aria-label="Foto del grupo">
<h1 id="group-name"></h1>
</section>
</main>
<script>
const groups=['Jaza','Mega','Nifla','Leitza','Mabri','Kasu','Mebu','Shingsha','Jamu','Shoja','Metu','Shalu','Netza','Ofna','Lojamuza'];
const groupColors={"jaza":["#F49AC2","#61B779"],"mega":["#FF9C4A","#80D8F2"],"nifla":["#F69BC9","#FFE56A"],"leitza":["#4AAD65","#F05252"],"mabri":["#8BD9F0","#AD86DF"],"kasu":["#E64B53","#2859B4"],"mebu":["#6BC680","#94DDF4"],"shingsha":["#FFFFFF","#151515"],"jamu":["#AE83DD","#FF9C42"],"shoja":["#F7A44C","#62BE78"],"metu":["#3977C9","#8C69CD"],"shalu":["#8CDEF6","#F7A9CB"],"netza":["#205C45","#8252AC","#181818"],"ofna":["#3573C4","#5BC182"],"lojamuza":["#316BC3","#F39AC6","#181818"]};
const requested=new URLSearchParams(location.search).get('grupo')||'';
const group=groups.find(g=>g.toLowerCase()===requested.toLowerCase());
if(!group){location.replace('index.html#grupos')}
else{
  document.getElementById('group-name').textContent=group;
  document.documentElement.dataset.grupo=group.toLowerCase();
  document.title=group+' · Tojnit Majané Kaitz 2026';
  const colors=groupColors[group.toLowerCase()];
  document.documentElement.style.setProperty('--group-hero','linear-gradient(115deg,'+colors.map((c,i)=>c+' '+Math.round(i*100/(colors.length-1))+'%').join(',')+')');
}
</script>
<script defer src="https://cdn.jsdelivr.net/npm/jszip@3.10.1/dist/jszip.min.js"></script>
<script defer src="fotos-grupos.js?v=14"></script>
</body>
</html>
